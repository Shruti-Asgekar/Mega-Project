services:
  - type: web
    name: mega-project-kyc
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: "production"
      - key: DEMO_MODE
        value: "false"
      - key: SEED_ON_START
        value: "false"
      - key: STORAGE_BACKEND
        value: "db"
      - key: ML_MODE
        value: "inprocess"
      - key: RETENTION_DAYS
        value: "30"
      - key: ADMIN_EMAIL
        value: "admin@kyc-verification.internal"
      - key: ADMIN_NAME
        value: "Lead Compliance Administrator"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: IDENTIFIER_HMAC_KEY
        generateValue: true
      - key: DEMO_ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
