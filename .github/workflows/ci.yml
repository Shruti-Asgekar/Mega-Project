name: CI Pipeline

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r backend/requirements.txt
          pip install -r ml-service/requirements.txt

      - name: Lint Backend with ruff
        run: |
          ruff check backend --select=E9,F63,F7,F82

      - name: Run Backend Tests
        run: |
          python -m pytest backend/tests

  ml-service-checks:
    name: ML Service Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r ml-service/requirements.txt
          pip install -r backend/requirements.txt

      - name: Lint ML Service with ruff
        run: |
          ruff check ml-service --select=E9,F63,F7,F82

      - name: Run ML Unit Tests
        run: |
          python -m pytest ml-service/tests
