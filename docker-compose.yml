version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kyc_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyc_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-kyc_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyc_user} -d ${POSTGRES_DB:-kyc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kyc_backend
    restart: always
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kyc_user}:${POSTGRES_PASSWORD:-kyc_password_placeholder}@postgres:5432/${POSTGRES_DB:-kyc_db}
      ML_SERVICE_URL: http://ml-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-shared_internal_secret_key_placeholder}
      FERNET_KEY: ${FERNET_KEY:-2zRv1_7Sh-fh-CbZcwppFjDks-71PHk_-HZeclMCcyo=}
      UPLOAD_DIR: /uploads
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: kyc_ml_service
    restart: always
    environment:
      PORT: 8001
      X_INTERNAL_KEY: ${X_INTERNAL_KEY:-shared_internal_secret_key_placeholder}
      BLUR_THRESHOLD: ${BLUR_THRESHOLD:-100}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  upload_data:
